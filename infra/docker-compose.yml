services:
  mysql:
    image: mysql:8.4
    container_name: threadmind-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: threadmind
      MYSQL_USER: threadmind
      MYSQL_PASSWORD: threadmind
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uthreadmind", "-pthreadmind"]
      interval: 10s
      timeout: 5s
      retries: 10
