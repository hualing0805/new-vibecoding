server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: threadmind-forum
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:threadmind}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:threadmind}
    password: ${MYSQL_PASSWORD:threadmind}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

threadmind:
  agent:
    base-url: ${AGENT_BASE_URL:http://localhost:8000}
    internal-token: ${AGENT_INTERNAL_TOKEN:dev-internal-token}

